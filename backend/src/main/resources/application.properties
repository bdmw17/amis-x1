spring.application.name=amis-backend

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/amis
spring.datasource.username=amis
spring.datasource.password=amis
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway (schema migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# Security – in dev alle Endpunkte erlaubt; in Produktion anpassen
spring.security.user.name=admin
spring.security.user.password=changeme

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS – Vue Dev-Server
# (wird in SecurityConfig.corsConfigurationSource() konfiguriert)
