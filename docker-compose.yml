services:
  postgres:
    image: postgres:16-alpine
    container_name: amis-postgres
    environment:
      POSTGRES_DB: amis
      POSTGRES_USER: amis
      POSTGRES_PASSWORD: amis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amis -d amis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
